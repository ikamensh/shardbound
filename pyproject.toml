[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shardbound"
version = "0.1.0"
description = "Shardbound — an Eador-inspired campaign with a province map and hex battles, on Saga2D"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ilya Kamenshchikov", email = "ilya.kamenshchikov@gmail.com" }]
dependencies = ["saga2d==0.3.2", "sagaforge"]

[project.optional-dependencies]
dev = ["pytest>=9.0.2"]

[project.scripts]
shardbound = "eador.__main__:main"

[tool.uv.sources]
sagaforge = { path = "../sagaforge", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["eador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
